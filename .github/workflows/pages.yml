# Publishes the browser client to GitHub Pages on every push to main.
# Skirmish vs. the computer runs fully in the browser; online play needs the Node server
# hosted elsewhere (set SERVER_URL in client/config.js).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Smoke test the simulation
        run: node test/headless.js
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -r client/* _site/
          cp -r shared _site/shared
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
